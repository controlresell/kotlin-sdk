name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # The Apple targets only compile on macOS; the Linux and Windows ones cross-compile there too. The runner image has the
    # Android SDK (ANDROID_HOME); AGP downloads the compileSdk platform when it is missing.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests (JVM, macOS arm64, iOS simulator arm64, JS and Wasm on Node)
        run: ./gradlew --no-daemon jvmTest macosArm64Test iosSimulatorArm64Test jsNodeTest wasmJsNodeTest
      - name: Compile the other targets
        run: ./gradlew --no-daemon compileAndroidMain compileKotlinIosArm64 compileKotlinIosX64 compileKotlinMacosX64 compileKotlinLinuxX64 compileKotlinLinuxArm64 compileKotlinMingwX64
