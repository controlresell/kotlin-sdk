name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # The Apple targets only compile on macOS; the Linux and Windows ones cross-compile there too.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests (JVM and macOS arm64)
        run: ./gradlew --no-daemon jvmTest macosArm64Test
      - name: Compile the other native targets
        run: ./gradlew --no-daemon compileKotlinMacosX64 compileKotlinLinuxX64 compileKotlinLinuxArm64 compileKotlinMingwX64
